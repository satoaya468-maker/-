    <form class="quote__grid" id="quote-form" action="send.php" method="post" enctype="multipart/form-data" novalidate data-reveal>
      <!-- ловушка для ботов -->
      <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
      <input type="hidden" name="ts" id="form-ts" value="">

      <div class="dropzone" id="dropzone">
        <span class="dropzone__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M11 16V7.8l-3.6 3.6L6 10l6-6 6 6-1.4 1.4L13 7.8V16h-2Zm-6 4v-4h2v2h10v-2h2v4H5Z"/></svg>
        </span>
        <h3>Чертёж или фото — сюда</h3>
        <p>Перетащите файл в эту зону или нажмите кнопку. Эскиз от руки, скрин из интернета и DXF — принимаем всё.</p>
        <p class="dropzone__formats">JPG · PNG · PDF · DXF · DWG · до 20 МБ</p>

        <button class="dropzone__pick" type="button" id="file-pick">Выбрать файл</button>
        <label class="visually-hidden" for="draft-file">Файл чертежа или фото</label>
        <input type="file" id="draft-file" name="files_picker" accept=".jpg,.jpeg,.png,.webp,.pdf,.dxf,.dwg" multiple>

        <div class="files" id="file-list"></div>
        <p class="dropzone__formats" id="file-count"></p>
        <p class="field__err" id="file-error" role="status"></p>
      </div>

      <div class="quote__form">
        <div class="field-row">
          <div class="field">
            <label for="q-name">Имя <span aria-hidden="true">*</span></label>
            <input type="text" id="q-name" name="name" autocomplete="name" placeholder="Как к вам обращаться" required>
            <p class="field__err"></p>
          </div>
          <div class="field">
            <label for="q-phone">Телефон <span aria-hidden="true">*</span></label>
            <input type="tel" id="q-phone" name="phone" autocomplete="tel" inputmode="tel" placeholder="+7 900 000-00-00" required>
            <p class="field__err"></p>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="q-material">Материал</label>
            <select id="q-material" name="material">
              <option value="">Не знаю / подскажите</option>
              <option>Сталь</option>
              <option>Нержавейка</option>
              <option>Оцинковка</option>
              <option>Алюминий</option>
            </select>
          </div>
          <div class="field">
            <label for="q-thickness">Толщина, мм</label>
            <select id="q-thickness" name="thickness">
              <option value="">Не знаю</option>
              <option>0,5</option><option>0,8</option><option>1</option><option>1,5</option>
              <option>2</option><option>2,5</option><option>3</option><option>4</option>
              <option>5</option><option>6</option><option>8</option><option>10</option>
              <option>12</option><option>14</option><option>16</option><option>18</option>
              <option>20</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="q-qty">Количество</label>
          <input type="text" id="q-qty" name="qty" inputmode="numeric" placeholder="Например: 1 комплект или 120 шт">
        </div>

        <div class="field">
          <label for="q-comment">Что нужно сделать</label>
          <textarea id="q-comment" name="comment" placeholder="Ворота 3×2 м с узором, покрасить в чёрный матовый. Или: резка по DXF, 40 деталей, сталь 3 мм."></textarea>
        </div>

        <div class="field">
          <div class="consent">
            <input type="checkbox" id="q-consent" name="consent" value="1" required>
            <label for="q-consent">Согласен на обработку персональных данных согласно
              <a href="politika.html">политике конфиденциальности</a></label>
          </div>
          <p class="field__err"></p>
        </div>

        <div class="quote__submit">
          <div class="progress" id="quote-progress" data-on="false" aria-hidden="true"><i></i></div>
          <button class="btn btn--spark btn--lg btn--wide" type="submit" id="quote-submit">
            <span class="btn__label">Отправить на расчёт</span>
          </button>
          <!-- TODO ТЕЛЕФОН: подставить реальный номер в ссылку wa.me -->
          <a class="btn btn--wide" id="wa-send" href="https://wa.me/79097490000" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.8 14.2c-.2.7-1.2 1.3-1.9 1.4-.5.1-1.2.2-3.5-.7-2.9-1.2-4.8-4.2-5-4.4-.1-.2-1.1-1.5-1.1-2.9 0-1.3.7-2 1-2.3.2-.3.6-.4.8-.4h.6c.2 0 .4 0 .7.5l.9 2.1c.1.2 0 .4-.1.5l-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.2.1.4.1.6-.1l.8-.9c.2-.2.4-.2.6-.1l2 1c.3.1.4.2.5.3.1.2.1.7-.1 1.3Z"/></svg>
            Отправить чертёж в WhatsApp
          </a>
        </div>

        <div class="result" id="quote-result" data-state="" role="status" aria-live="polite">
          <p class="result__title"></p>
          <p class="result__text"></p>
          <span class="timer" id="quote-timer">60:00</span>
          <small>ответим в течение часа</small>
        </div>
      </div>
    </form>
