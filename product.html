<!DOCTYPE html>
<html lang="ru">
<head>

  <meta name="robots" content="noindex, nofollow">

  <link rel="preload" href="assets/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="product" class="prod-bottom-pad">
<div id="app-header"></div>

<main class="wrap">
  <nav class="crumbs" id="crumbs" aria-label="Хлебные крошки"></nav>

  <div class="prod">
    <div class="gallery" id="gallery"></div>
    <div class="pinfo" id="pinfo"></div>
  </div>

  <section class="sec">
    <div class="wrap" style="padding:0">
      <div class="bundle" id="bundle"></div>
    </div>
  </section>

  <section class="sec" id="acc-sec" style="padding-top:10px">
    <div class="sec-head"><h2>С этим товаром покупают</h2></div>
    <div class="minicards" id="acc-cards"></div>
  </section>

  <div class="prod-sections">
    <section class="sec">
      <h2>Характеристики</h2>
      <dl class="specs" id="specs"></dl>
    </section>

    <section class="sec">
      <h2>Описание</h2>
      <div class="prose" id="pdesc"></div>
    </section>

    <section class="sec" id="reviews">
      <h2>Отзывы</h2>
      <div class="rev-summary" id="rev-summary"></div>
      <div id="reviews-list"></div>
      <button class="btn btn-outline rev-cta" id="rev-add">Написать отзыв</button>
    </section>
  </div>

  <section class="sec" id="related"></section>
</main>

<div class="buybar" id="buybar"></div>

<div id="app-footer"></div>
<script src="js/art.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>

</html>
