:root {
  --bg: #ffffff;
  --surface: #f5f5f7;
  --surface-2: #ececef;
  --ink: #0e0e12;
  --ink-2: #63636d;
  --ink-3: #8e8e99;
  --line: #e6e6ea;
  --accent: #0051e6;
  --accent-h: #0041ba;
  --accent-soft: #e8efff;
  --sale: #d81f33;
  --sale-soft: #fdeaed;
  --ok: #0a8a50;
  --ok-soft: #e6f6ee;
  --dark: #0c0c11;
  --dark-2: #17171f;
  --r-tile: 22px;
  --r-card: 18px;
  --r-in: 12px;
  --ease: cubic-bezier(.23, 1, .32, 1);
  --sh-1: 0 1px 2px rgba(14, 14, 18, .05);
  --sh-2: 0 10px 30px rgba(14, 14, 18, .10);
  --sh-3: 0 24px 60px rgba(14, 14, 18, .16);
  --hdr-h: 68px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
ul, ol { list-style: none; }
h1, h2, h3, h4 { line-height: 1.15; letter-spacing: -0.02em; text-wrap: balance; font-weight: 800; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }

.wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Кнопки ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 46px; padding: 0 24px; border-radius: 999px;
  font-size: 15px; font-weight: 600; white-space: nowrap; user-select: none;
  transition: background-color .18s var(--ease), color .18s var(--ease), transform .16s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-dark { background: var(--ink); color: #fff; }
.btn-ghost { background: var(--surface); color: var(--ink); }
.btn-light { background: #fff; color: var(--ink); }
.btn-outline { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn-owhite { background: transparent; color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.4); }
.btn-lg { height: 54px; padding: 0 30px; font-size: 16px; }
.btn-sm { height: 38px; padding: 0 16px; font-size: 14px; }
.btn-block { width: 100%; }
.btn svg { width: 18px; height: 18px; flex: none; }
@media (hover: hover) and (pointer: fine) {
  .btn-primary:hover { background: var(--accent-h); }
  .btn-dark:hover { background: #26262e; }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-light:hover { background: var(--surface); }
  .btn-outline:hover { box-shadow: inset 0 0 0 1.5px var(--ink-3); }

/* ---------- Бейджи, рейтинг, цены ---------- */

@media (prefers-reduced-motion: no-preference) {

.pricein { display: flex; gap: 8px; }

.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 14px; }

/* Витрина флагмана в категории */
.showcase {
  grid-column: 1 / -1; position: relative; overflow: hidden;

}
.showcase .sc-kick { font-size: 13px; font-weight: 700; color: #9db4ff; margin-bottom: 10px; }
.showcase h3 { font-size: clamp(1.4rem, 2.4vw, 2rem); max-width: 55%; margin-bottom: 10px; }
.showcase p { color: rgba(255,255,255,.7); font-size: 14.5px; max-width: 50%; margin-bottom: 22px; }
.showcase .sc-price { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
.showcase .sc-price .price-old { color: rgba(255,255,255,.45); font-size: 15px; margin-left: 10px; }
.showcase .promo-art { width: 46%; right: -16px; bottom: -30px; }

.pager { display: flex; gap: 8px; justify-content: center; margin-top: 34px; }
.pageb {
  min-width: 42px; height: 42px; padding: 0 10px; border-radius: 12px; background: var(--surface);
  font-size: 14.5px; font-weight: 700; transition: background-color .16s, color .16s, transform .14s;
}
.pageb:active { transform: scale(.95); }
.pageb.on { background: var(--ink); color: #fff; pointer-events: none; }
@media (hover: hover) { .pageb:not(.on):hover { background: var(--surface-2); } }

.noresults { text-align: center; padding: 70px 20px; color: var(--ink-2); }
.noresults b { display: block; font-size: 19px; color: var(--ink); margin-bottom: 8px; }

/* ---------- Карточка товара (страница) ---------- */
.prod { display: grid; grid-template-columns: 1.02fr 1fr; gap: 48px; align-items: start; padding-top: 10px; }
.gallery { position: sticky; top: calc(var(--hdr-h) + 16px); }
.gmain {
  background: var(--surface); border-radius: var(--r-tile); aspect-ratio: 5 / 4;
  display: grid; place-items: center; overflow: hidden; margin-bottom: 12px; position: relative;
}
.gmain svg { width: 86%; height: 86%; transition: transform .35s var(--ease); }
.gmain.zoom svg { transform: scale(1.45); }
.gmain.dark { background: linear-gradient(140deg, #1a1a24, var(--dark)); }
.gmain-badges { position: absolute; top: 14px; left: 14px; display: flex; gap: 6px; }
.gthumbs { display: flex; gap: 10px; }
.gthumb {
  width: 74px; height: 64px; border-radius: 12px; background: var(--surface);
  display: grid; place-items: center; overflow: hidden; border: 2px solid transparent;
  transition: border-color .18s var(--ease), transform .16s;
}
.gthumb:active { transform: scale(.95); }
.gthumb.dark { background: linear-gradient(140deg, #1a1a24, var(--dark)); }
.gthumb.on { border-color: var(--accent); }
.gthumb svg { width: 82%; height: 82%; }
.gthumb.z svg { transform: scale(1.5); }

.pinfo h1 { font-size: clamp(1.4rem, 2.4vw, 1.9rem); letter-spacing: -0.025em; margin-bottom: 10px; }
.pmeta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-3); margin-bottom: 18px; }
.pmeta .rev-link { color: var(--ink-2); font-weight: 600; border-bottom: 1px dashed #c6c6cf; }
.pmeta .rev-link:hover { color: var(--ink); }
.pprice { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.pprice .now { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
.pprice .price-old { font-size: 17px; }
.installment { font-size: 14px; color: var(--ink-2); margin-bottom: 16px; }
.installment b { color: var(--ink); }
.stock { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; color: var(--ok); margin-bottom: 22px; }
.stock svg { width: 16px; height: 16px; }

.buyrow { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.buyrow .btn-primary { flex: 1.4; min-width: 180px; }
.buyrow .btn-ghost { flex: 1; min-width: 150px; }
.oneclick-note { font-size: 12.5px; color: var(--ink-3); margin-bottom: 24px; }

.dlv-mini { border: 1px solid var(--line); border-radius: var(--r-card); padding: 6px 18px; margin-bottom: 28px; }
.dlv-row { display: flex; gap: 13px; padding: 13px 0; align-items: flex-start; }
.dlv-row + .dlv-row { border-top: 1px solid var(--line); }
.dlv-row svg { width: 20px; height: 20px; color: var(--accent); flex: none; margin-top: 1px; }
.dlv-row b { font-size: 14.5px; display: block; }
.dlv-row span { font-size: 13px; color: var(--ink-2); }

/* Комплект */
.bundle { background: var(--surface); border-radius: var(--r-tile); padding: 24px; margin-bottom: 28px; }
.bundle h3 { font-size: 16.5px; margin-bottom: 16px; }
.bundle-items { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.bundle-item { width: 86px; text-align: center; }
.bundle-item .bi-art { width: 86px; height: 72px; background: #fff; border-radius: 12px; display: grid; place-items: center; box-shadow: var(--sh-1); margin-bottom: 6px; }
.bundle-item .bi-art svg { width: 80%; height: 80%; }
.bundle-item span { font-size: 11px; color: var(--ink-2); line-height: 1.3; display: block; }
.bundle-plus { font-size: 20px; font-weight: 700; color: var(--ink-3); }
.bundle-total { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bundle-total .bt-price { font-size: 20px; font-weight: 800; }
.bundle-save { color: var(--ok); font-weight: 700; font-size: 14px; }

/* Апсейл-лента мелких карточек */
.minicards { display: grid; grid-auto-flow: column; grid-auto-columns: 236px; gap: 12px; overflow-x: auto; padding: 4px 2px 14px; scrollbar-width: none; scroll-snap-type: x proximity; }
.minicards::-webkit-scrollbar { display: none; }
.minicard {
  display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--line);
  border-radius: 14px; padding: 10px; scroll-snap-align: start;
  transition: box-shadow .2s var(--ease), transform .2s var(--ease);
}
@media (hover: hover) { .minicard:hover { box-shadow: var(--sh-2); transform: translateY(-2px); } }
.minicard .mc-art { width: 62px; height: 56px; background: var(--surface); border-radius: 10px; display: grid; place-items: center; flex: none; }
.minicard .mc-art svg { width: 84%; height: 84%; }
.minicard b { font-size: 12.5px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.minicard .mc-price { font-size: 13.5px; font-weight: 800; margin-top: 3px; }
.minicard .mc-add { margin-left: auto; flex: none; width: 34px; height: 34px; border-radius: 999px; background: var(--surface); display: grid; place-items: center; transition: background-color .16s, color .16s, transform .14s; }
.minicard .mc-add svg { width: 15px; height: 15px; }
.minicard .mc-add:active { transform: scale(.9); }
@media (hover: hover) { .minicard .mc-add:hover { background: var(--accent); color: #fff; } }

/* Характеристики, описание, отзывы */
.prod-sections { max-width: 880px; }
.prod-sections h2 { font-size: 1.5rem; margin-bottom: 20px; }
.specs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 40px; }
.spec { display: flex; justify-content: space-between; gap: 18px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.spec dt { color: var(--ink-2); }
.spec dd { font-weight: 600; text-align: right; }
.prose { color: var(--ink-2); font-size: 15.5px; max-width: 68ch; line-height: 1.65; }
.prose b { color: var(--ink); }

.rev-summary { display: flex; align-items: center; gap: 18px; background: var(--surface); border-radius: var(--r-card); padding: 20px 24px; margin-bottom: 18px; }
.rev-summary .rs-num { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
.rev-summary .rs-meta { font-size: 13.5px; color: var(--ink-2); }
.review { border-bottom: 1px solid var(--line); padding: 18px 0; }
.review-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.review-top b { font-size: 15px; }
.review-top time { font-size: 13px; color: var(--ink-3); }
.review p { font-size: 14.5px; color: var(--ink-2); max-width: 68ch; }
.rev-empty { color: var(--ink-2); font-size: 15px; padding: 8px 0 4px; }
.rev-cta { margin-top: 18px; }

/* Липкая мобильная панель покупки */
.buybar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  display: none; align-items: center; gap: 14px;
  transform: translateY(102%); transition: transform .3s var(--ease);
}
.buybar.show { transform: none; }
.buybar .bb-price { font-size: 18px; font-weight: 800; }
.buybar .bb-price small { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.buybar .btn { flex: 1; }

/* ---------- Корзина ---------- */
.cart-layout { display: grid; grid-template-columns: 1fr 380px; gap: 36px; align-items: start; }
.cline { display: grid; grid-template-columns: 96px 1fr auto; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); align-items: center; }
.cline-art { width: 96px; height: 80px; background: var(--surface); border-radius: 12px; display: grid; place-items: center; }
.cline-art svg { width: 84%; height: 84%; }
.cline-info b { font-size: 14.5px; font-weight: 600; display: block; margin-bottom: 2px; }
.cline-info span { font-size: 12.5px; color: var(--ink-3); }
.cline-info .cl-unit { font-size: 13px; color: var(--ink-2); margin-top: 4px; display: block; }
.cline-side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.cline-sum { font-size: 16px; font-weight: 800; white-space: nowrap; }
.cline-old { font-size: 12.5px; }
.qty { display: inline-flex; align-items: center; background: var(--surface); border-radius: 999px; }
.qty button { width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; transition: background-color .15s, transform .12s; }
.qty button svg { width: 14px; height: 14px; }
.qty button:active { transform: scale(.9); }
@media (hover: hover) { .qty button:hover { background: var(--surface-2); } }
.qty b { min-width: 30px; text-align: center; font-size: 14.5px; }
.cl-remove { color: var(--ink-3); font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; transition: color .15s; }
.cl-remove svg { width: 14px; height: 14px; }
.cl-remove:hover { color: var(--sale); }

.bundleline { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; color: var(--ok); font-weight: 600; }
.bundleline svg { width: 16px; height: 16px; flex: none; }

.csummary { background: var(--surface); border-radius: var(--r-tile); padding: 26px; position: sticky; top: calc(var(--hdr-h) + 16px); }
.csummary h3 { font-size: 17px; margin-bottom: 16px; }
.crow { display: flex; justify-content: space-between; gap: 14px; font-size: 14.5px; padding: 6px 0; color: var(--ink-2); }
.crow b { color: var(--ink); font-weight: 600; }
.crow.saving { color: var(--ok); }
.crow.saving b { color: var(--ok); }
.ctotal { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #dcdce2; margin-top: 12px; padding-top: 16px; margin-bottom: 18px; }
.ctotal .tt { font-size: 15px; font-weight: 700; }
.ctotal .tsum { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.promo-row { display: flex; gap: 8px; margin: 14px 0 6px; }
.promo-row input { flex: 1; height: 44px; border: 1.5px solid transparent; background: #fff; border-radius: 12px; padding: 0 14px; font-size: 14px; }
.promo-row input:focus { outline: none; border-color: var(--accent); }
.promo-msg { font-size: 12.5px; margin-bottom: 8px; min-height: 18px; }
.promo-msg.ok { color: var(--ok); }
.promo-msg.err { color: var(--sale); }
.csummary .fine { font-size: 12px; color: var(--ink-3); margin-top: 12px; line-height: 1.5; }

.empty { text-align: center; padding: 80px 20px; }
.empty .e-ic { width: 84px; height: 84px; border-radius: 999px; background: var(--surface); display: grid; place-items: center; margin: 0 auto 22px; color: var(--ink-3); }
.empty .e-ic svg { width: 36px; height: 36px; }
.empty h1 { font-size: 24px; margin-bottom: 10px; }
.empty p { color: var(--ink-2); margin-bottom: 26px; }

/* Оформление заказа */
.checkout { margin-top: 40px; }
.checkout h2 { font-size: 1.5rem; margin-bottom: 22px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.field label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 7px; }
.field input, .field textarea {
  width: 100%; height: 50px; border: 1.5px solid var(--line); border-radius: var(--r-in);
  padding: 0 16px; font-size: 15px; background: #fff;
  transition: border-color .16s, box-shadow .16s;
}
.field textarea { height: auto; min-height: 90px; padding: 13px 16px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field .hint { font-size: 12px; color: var(--ink-3); margin-top: 5px; }
.field.err input { border-color: var(--sale); }
.field .errmsg { font-size: 12.5px; color: var(--sale); margin-top: 5px; display: none; }
.field.err .errmsg { display: block; }
.field-full { grid-column: 1 / -1; }

.rgroup { display: grid; gap: 10px; }
.rcard {
  display: flex; gap: 13px; align-items: flex-start; border: 1.5px solid var(--line);
  border-radius: var(--r-card); padding: 16px; cursor: pointer;
  transition: border-color .18s, background-color .18s;
}
.rcard input { position: absolute; opacity: 0; }
.rcard .dot { width: 20px; height: 20px; border-radius: 999px; border: 1.5px solid #cfcfd8; flex: none; margin-top: 1px; display: grid; place-items: center; transition: border-color .15s; }
.rcard .dot::after { content: ''; width: 10px; height: 10px; border-radius: 999px; background: var(--accent); transform: scale(0); transition: transform .18s var(--ease); }
.rcard input:checked ~ .dot { border-color: var(--accent); }
.rcard input:checked ~ .dot::after { transform: scale(1); }
.rcard:has(input:checked) { border-color: var(--accent); background: #f7faff; }
.rcard b { display: block; font-size: 15px; }
.rcard span { font-size: 13px; color: var(--ink-2); }
.rcard .rc-tag { margin-left: auto; font-size: 13.5px; font-weight: 700; white-space: nowrap; }

.success { text-align: center; padding: 70px 20px; max-width: 520px; margin: 0 auto; }
.success .s-ic { width: 92px; height: 92px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; margin: 0 auto 24px; }
.success .s-ic svg { width: 42px; height: 42px; }
.success h1 { font-size: 26px; margin-bottom: 12px; }
.success p { color: var(--ink-2); margin-bottom: 8px; }
.success .ordernum { font-weight: 800; color: var(--ink); }
.success .btn { margin-top: 24px; }

/* ---------- Статические страницы ---------- */
.page-head { padding: 34px 0 8px; max-width: 720px; }
.page-head h1 { font-size: clamp(1.8rem, 3.4vw, 2.6rem); letter-spacing: -0.03em; margin-bottom: 14px; }
.page-head .lead { font-size: 17px; color: var(--ink-2); }

.infocards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.infocard { background: var(--surface); border-radius: var(--r-tile); padding: 26px; }
.infocard .t-ic { width: 46px; height: 46px; border-radius: 14px; background: #fff; box-shadow: var(--sh-1); display: grid; place-items: center; color: var(--accent); margin-bottom: 16px; }
.infocard .t-ic svg { width: 22px; height: 22px; }
.infocard b { display: block; font-size: 16.5px; margin-bottom: 7px; letter-spacing: -0.01em; }
.infocard p { font-size: 14px; color: var(--ink-2); line-height: 1.55; }
.infocard .ic-tag { display: inline-flex; margin-top: 14px; font-size: 13.5px; font-weight: 700; color: var(--accent); }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
.split h2 { font-size: 1.5rem; margin-bottom: 16px; }
.split .prose { margin-bottom: 14px; }

.faq details { border-bottom: 1px solid var(--line); }
.faq summary {
  list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px;
  padding: 18px 2px; font-size: 15.5px; font-weight: 600;
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary svg { width: 18px; height: 18px; flex: none; color: var(--ink-3); transition: transform .25s var(--ease); }
.faq details[open] summary svg { transform: rotate(45deg); }
.faq .faq-a { padding: 0 2px 18px; color: var(--ink-2); font-size: 14.5px; max-width: 68ch; }

/* Карта */
.map-card { position: relative; border-radius: var(--r-tile); overflow: hidden; background: #e9edf3; min-height: 380px; }
.map-card > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-overlay {
  position: absolute; left: 20px; bottom: 20px; background: #fff; border-radius: 16px;
  padding: 18px 20px; box-shadow: var(--sh-2); max-width: 320px;
}
.map-overlay b { display: block; font-size: 15.5px; margin-bottom: 4px; }
.map-overlay span { font-size: 13.5px; color: var(--ink-2); display: block; margin-bottom: 12px; }

.contact-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 40px; align-items: start; }

/* ---------- Тост ---------- */
.toast {
  position: fixed; left: 50%; bottom: 26px; z-index: 100;
  background: var(--ink); color: #fff; border-radius: 999px; padding: 13px 22px;
  font-size: 14px; font-weight: 600; box-shadow: var(--sh-3);
  display: flex; align-items: center; gap: 14px; white-space: nowrap;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  transition: transform .3s var(--ease), opacity .3s var(--ease);
  max-width: calc(100vw - 32px);
}
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast a { color: #9db4ff; font-weight: 700; }

/* ---------- Модальное окно ---------- */
.modal { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; padding: 20px; visibility: hidden; pointer-events: none; }
.modal.open { visibility: visible; pointer-events: auto; }
.modal-bg { position: absolute; inset: 0; background: rgba(14,14,18,.45); opacity: 0; transition: opacity .25s var(--ease); }
.modal.open .modal-bg { opacity: 1; }
.modal-panel {
  position: relative; background: #fff; border-radius: 24px; padding: 32px; width: min(440px, 100%);
  box-shadow: var(--sh-3); transform: scale(.95) translateY(12px); opacity: 0;
  transition: transform .3s var(--ease), opacity .25s var(--ease);
}
.modal.open .modal-panel { transform: none; opacity: 1; }
.modal-x { position: absolute; top: 14px; right: 14px; }
.modal-panel h3 { font-size: 20px; margin-bottom: 8px; letter-spacing: -0.02em; }
.modal-panel .m-sub { font-size: 14px; color: var(--ink-2); margin-bottom: 20px; }
.modal-prod { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 14px; padding: 10px 14px; margin-bottom: 20px; }
.modal-prod .mp-art { width: 54px; height: 46px; flex: none; display: grid; place-items: center; }
.modal-prod b { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.modal-prod span { font-size: 14px; font-weight: 800; margin-left: auto; white-space: nowrap; }
.modal .field { margin-bottom: 14px; }
.modal .fine { font-size: 12px; color: var(--ink-3); margin-top: 12px; }

/* ---------- Reveal ---------- */
.r { opacity: 1; }
.js .r.armed { opacity: 0; transform: translateY(16px); }
.js .r.armed.in { opacity: 1; transform: none; transition: opacity .55s var(--ease), transform .55s var(--ease); }

/* ---------- Адаптив ---------- */
@media (max-width: 1120px) {
  .track { grid-auto-columns: calc((100% - 28px) / 3); }
  .cats-grid { grid-template-columns: repeat(4, 1fr); }
  .hdr-phone { display: none; }
}
@media (max-width: 960px) {
  .nav, .search { display: none; }
  .burger { display: inline-flex; }
  .hero-in { grid-template-columns: 1fr; padding: 40px 32px; gap: 28px; }
  .hero-art { height: 300px; max-width: 520px; }
  .cats-grid { grid-template-columns: repeat(3, 1fr); }
  .trust-grid, .promo-duo { grid-template-columns: 1fr 1fr; }
  .prod { grid-template-columns: 1fr; gap: 32px; }
  .gallery { position: static; }
  .cart-layout { grid-template-columns: 1fr; }
  .csummary { position: static; }
  .visit, .split, .contact-grid { grid-template-columns: 1fr; }
  .cat-layout { grid-template-columns: 1fr; }
  .filters {
    position: fixed; inset: 0; z-index: 92; background: #fff; padding: 20px 22px 90px;
    overflow-y: auto; transform: translateX(-102%); transition: transform .3s var(--ease);
  }
  .filters.open { transform: none; }
  .fbtn { display: inline-flex; }
  .fclose-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .fapply { position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 93; display: none; }
  .filters.open ~ .fapply, .filters.open + .fapply { display: flex; }
  .ftr-grid { grid-template-columns: 1fr 1fr; gap: 28px; padding: 44px 0 32px; }
}
@media (max-width: 680px) {
  .wrap { padding: 0 16px; }
  .hero { padding-top: 16px; }
  .hero-in { padding: 30px 22px; border-radius: 22px; }
  .hero p { font-size: 15.5px; }
  .track { grid-auto-columns: calc((100% - 14px) / 1.75); }
  .cats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat-tile { min-height: 128px; padding: 16px 16px 8px; }
  .promo-duo, .trust-grid { grid-template-columns: 1fr; }
  .promo-tile h3, .promo-tile p { max-width: 70%; }
  .bigbanner { padding: 34px 26px; }

  .showcase { padding: 28px 24px; min-height: 240px; }

}

/* ---------- Фото товаров (замена SVG-артов реальными снимками) ---------- */
.pcard-art img, .gthumb img, .mc-art img, .bi-art img, .cline-art img, .mp-art img, .ha img {
  width: 88%; height: 88%; object-fit: contain; mix-blend-mode: multiply;
}
.gmain img { width: 86%; height: 86%; object-fit: contain; mix-blend-mode: multiply; }
.gmain.zoom img { transform: scale(1.45); }
/* Полнокадровое фото-обложка (интерьерные снимки, напр. ТВ) */
.pcard-art .pimg-cover, .gthumb .pimg-cover, .mc-art .pimg-cover, .cline-art .pimg-cover, .bi-art .pimg-cover {
  width: 100%; height: 100%; object-fit: cover; mix-blend-mode: normal; border-radius: inherit;
}
.gmain .pimg-cover { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: normal; }
.gmain.dark img, .promo-dark .promo-art img, .showcase .promo-art img { mix-blend-mode: normal; }
.promo-art img { width: 100%; object-fit: contain; }

/* ---------- Полёт товара в корзину ---------- */
.fly {
  position: fixed; z-index: 120; width: 46px; height: 42px; border-radius: 12px;
  background: var(--surface); box-shadow: var(--sh-2);
  display: grid; place-items: center; overflow: hidden; pointer-events: none;
}
.fly svg, .fly img { width: 82%; height: 82%; object-fit: contain; }

/* Кроссфейд галереи товара */
.gmain svg, .gmain img { transition: transform .35s var(--ease), opacity .16s ease; }
.gmain.fading svg, .gmain.fading img { opacity: 0; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

@media print {
  .hdr, .topbar, .ftr, .buybar, .toast { display: none; }
}

-linejoin=\"round\"><path d=\"M3 6.5h11v9H3zM14 9.5h4l3 3v3h-7\"/><circle cx=\"7\" cy=\"17.5\" r=\"1.8\"/><circle cx=\"17\" cy=\"17.5\" r=\"1.8\"/><\/svg><\/span>\n        <b>Курьером по Магнитогорску<\/b>\n        <p>От 2 часов в день заказа. Стоимость 300 ₽, при заказе от 5 000 ₽ привезём бесплатно. Крупную технику поднимем на этаж.<\/p>\n        <span class=\"ic-tag\">300 ₽ · бесплатно от 5 000 ₽<\/span>\n      <\/div>\n      <div class=\"infocard r\">\n        <span class=\"t-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m12 3 8 4.2v9.6L12 21l-8-4.2V7.2z\"/><path d=\"m4.6 7.5 7.4 4 7.4-4M12 11.5V21\"/><\/svg><\/span>\n        <b>По России<\/b>\n        <p>Отправим СДЭК или Почтой России в любой город за 2-7 дней. Стоимость рассчитывается при оформлении, технику страхуем.<\/p>\n        <span class=\"ic-tag\">От 350 ₽<\/span>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"sec\">\n    <div class=\"sec-head\"><h2>Как оплатить<\/h2><\/div>\n    <div class=\"infocards\">\n      <div class=\"infocard r\">\n        <span class=\"t-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5.5\" width=\"18\" height=\"13\" rx=\"2.5\"/><path d=\"M3 10h18\"/><\/svg><\/span>\n        <b>При получении<\/b>\n        <p>Наличными или картой: в магазине на кассе, курьеру при доставке. Чек выдаём сразу.<\/p>\n      <\/div>\n      <div class=\"infocard r\">\n        <span class=\"t-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 18 12-12\"/><circle cx=\"7.8\" cy=\"7.8\" r=\"2.3\"/><circle cx=\"16.2\" cy=\"16.2\" r=\"2.3\"/><\/svg><\/span>\n        <b>Рассрочка 0-0-12<\/b>\n        <p>Без первого взноса и переплат на срок до 12 месяцев. Оформление в магазине за 10 минут, нужен только паспорт.<\/p>\n      <\/div>\n      <div class=\"infocard r\">\n        <span class=\"t-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 3 5 13.5h5.5L11 21l8-10.5h-5.5z\"/><\/svg><\/span>\n        <b>Онлайн на сайте<\/b>\n        <p>Оплата картой на сайте с электронным чеком по 54-ФЗ подключается на следующем этапе развития магазина.<\/p>\n        <span class=\"ic-tag\">Скоро<\/span>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"sec\">\n    <div class=\"split\">\n      <div>\n        <h2>Частые вопросы<\/h2>\n        <div class=\"faq\">\n          <details>\n            <summary>Когда привезут заказ, оформленный вечером?\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg><\/summary>\n            <p class=\"faq-a\">Заказы, подтверждённые до 17:00, доставляем в тот же день. Оформленные позже привезём на следующий день в удобный интервал: утро, день или вечер.<\/p>\n          <\/details>\n          <details>\n            <summary>Можно ли проверить технику при получении?\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg><\/summary>\n            <p class=\"faq-a\">Да, и мы это рекомендуем. Курьер подождёт, пока вы осмотрите комплектацию и включите устройство. В магазине проверим технику вместе с вами на кассе.<\/p>\n          <\/details>\n          <details>\n            <summary>Сколько хранится заказ на самовывозе?\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg><\/summary>\n            <p class=\"faq-a\">Три дня с момента подтверждения. Если нужно больше, позвоните: продлим резерв или предложим доставку.<\/p>\n          <\/details>\n          <details>\n            <summary>Доставляете ли крупную бытовую технику?\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg><\/summary>\n            <p class=\"faq-a\">Да. Холодильники, стиральные машины и телевизоры от 55 дюймов доставляем с подъёмом на этаж и заносом в квартиру. Подключение обсуждается с менеджером.<\/p>\n          <\/details>\n        <\/div>\n      <\/div>\n      <div>\n        <h2>Зона доставки<\/h2>\n        <p class=\"prose\">Доставляем по всему Магнитогорску, включая левый берег, а также в ближайшие посёлки: Западный, Нежный, Радужный. Для отдалённых районов время и стоимость согласует менеджер при подтверждении заказа.<\/p>\n        <div class=\"shopcard\" style=\"margin-top:20px\">\n          <div class=\"shopcard-row\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"/><path d=\"M12 7.5V12l3 2.5\"/><\/svg>\n            <div><b>Ближайшая доставка: сегодня<\/b><span>При подтверждении заказа до 17:00<\/span><\/div>\n          <\/div>\n          <div class=\"shopcard-row\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5.5 4h3l1.7 4.2-2 1.6a12.5 12.5 0 0 0 5.9 5.9l1.6-2 4.3 1.7v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 3.5 6.2 2 2 0 0 1 5.5 4z\"/><\/svg>\n            <div><b>+7 908 089-52-68<\/b><span>Вопросы по доставке и подъёму на этаж<\/span><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n<\/main>"}, "warranty": {"title": "Гарантия и сервис · Ракета, Магнитогорск", "html": "<main class=\"wrap\">\n  <div class=\"page-head\">\n    <h1>Гарантия и сервис<\/h1>\n    <p class=\"lead\">Покупка в «Ракете» защищена дважды: официальной гарантией производителя и нашим собственным сервисным центром в этом же здании.<\/p>\n  <\/div>\n\n  <section class=\"sec\" style=\"padding-top:24px\">\n    <div class=\"infocards\">\n      <div class=\"infocard r\">\n        <span class=\"t-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3.5 5 6v5.2c0 4.4 3 7.7 7 9.3 4-1.6 7-4.9 7-9.3V6z\"/><path d=\"m9.2 11.8 2 2 3.8-4\"/><\/svg><\/span>\n        <b>Официальная гарантия<\/b>\n        <p>На всю технику действует гарантия производителя от 12 месяцев. Гарантийный талон и чек оформляем при покупке, серийный номер проверяем вместе с вами.<\/p>\n      <\/div>\n      <div class=\"infocard r\">\n        <span class=\"t-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 6.5a4 4 0 0 0-5.4 4.6L4 16.2A2 2 0 1 0 6.8 19l5.1-5.1a4 4 0 0 0 4.6-5.4l-2.6 2.6-2.3-.6-.6-2.3z\"/><\/svg><\/span>\n        <b>Свой сервисный центр<\/b>\n        <p>Ремонтируем смартфоны Apple, Samsung, Xiaomi, HONOR, Huawei и другие бренды: экраны, батареи, разъёмы. Диагностика бесплатно, большинство работ за 1-2 дня.<\/p>\n      <\/div>\n      <div class=\"infocard r\">\n        <span class=\"t-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m12 3 8 4.2v9.6L12 21l-8-4.2V7.2z\"/><path d=\"m4.6 7.5 7.4 4 7.4-4M12 11.5V21\"/><\/svg><\/span>\n        <b>Обмен и возврат 14 дней<\/b>\n        <p>Не подошёл товар? Вернём деньги или обменяем в течение 14 дней при сохранении товарного вида и комплектации, по закону о защите прав потребителей.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"sec\">\n    <div class=\"split\">\n      <div>\n        <h2>Если что-то случилось<\/h2>\n        <p class=\"prose\">Принесите устройство с чеком в магазин на Карла Маркса, 92. Диагностику сделаем бесплатно и сразу скажем: это гарантийный случай, платный ремонт или проще заменить устройство.<\/p>\n        <p class=\"prose\">Гарантийные случаи решаем сами или через авторизованные сервисные центры производителя. На время долгого ремонта техники из подменного фонда предложим временное устройство.<\/p>\n        <p class=\"prose\"><b>Что взять с собой:<\/b> устройство в полной комплектации, чек или номер заказа, гарантийный талон, если выдавался.<\/p>\n        <a class=\"btn btn-primary\" href=\"contacts.html\" style=\"margin-top:8px\">Задать вопрос сервису<\/a>\n      <\/div>\n      <div>\n        <h2>Частые вопросы<\/h2>\n        <div class=\"faq\">\n          <details>\n            <summary>Сколько длится гарантийный ремонт?\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg><\/summary>\n            <p class=\"faq-a\">По закону до 45 дней, на практике большинство обращений закрываем за 3-10 дней. О готовности сообщим по телефону или в мессенджере.<\/p>\n          <\/details>\n          <details>\n            <summary>Чек потерялся. Гарантия сгорела?\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg><\/summary>\n            <p class=\"faq-a\">Нет. Покупку восстановим по номеру телефона из базы магазина, а электронный чек продублируем на почту.<\/p>\n          <\/details>\n          <details>\n            <summary>Ремонтируете технику, купленную не у вас?\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg><\/summary>\n            <p class=\"faq-a\">Да, сервисный центр принимает любые смартфоны и ноутбуки вне гарантии. Диагностика бесплатная         return p ? { p: p, qty: i.qty, sum: p.price * i.qty, oldSum: (p.old || p.price) * i.qty } : null;
      }).filter(Boolean);
      var subtotal = lines.reduce(function (s, l) { return s + l.sum; }, 0);
      var oldSubtotal = lines.reduce(function (s, l) { return s + l.oldSum; }, 0);
      var activeBundles = c.bundles.map(byId).filter(function (p) {
        if (!p || !p.bundle) return false;
        var ids = c.items.map(function (i) { return i.id; });
        return ids.indexOf(p.id) !== -1 && p.bundle.items.every(function (id) { return ids.indexOf(id) !== -1; });
      });
      var bundleSave = activeBundles.reduce(function (s, p) { return s + p.bundle.save; }, 0);
      var promoSave = promoRate ? Math.round((subtotal - bundleSave) * promoRate) : 0;
      return {
        lines: lines, count: this.count(),
        subtotal: subtotal, oldSubtotal: oldSubtotal,
        productSave: oldSubtotal - subtotal,
        bundles: activeBundles, bundleSave: bundleSave, promoSave: promoSave,
        total: subtotal - bundleSave - promoSave
      };
    }
  };

  /* ---------- Reveal-on-scroll ---------- */
  function reveal() {
    var els = document.querySelectorAll('.r');
    if (!('IntersectionObserver' in window) ||
        window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add('in'); obs.unobserve(en.target); }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
    els.forEach(function (el, i) {
      var rect = el.getBoundingClientRect();
      if (rect.top < window.innerHeight * 0.9) return; // не прячем то, что уже на экране
      el.classList.add('armed');
      el.style.transitionDelay = Math.min((i % 4) * 60, 180) + 'ms';
      obs.observe(el);
      /* Страховка: контент не должен зависеть от скролл-анимации */
      setTimeout(function () { el.classList.add('in'); }, 1800);
    });
  }

  /* Лёгкий параллакс устройств в хиро за курсором */
  function heroParallax() {
    var box = document.querySelector('.hero-in');
    if (!box) return;
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var layers = box.querySelectorAll('.hero-art .ha');
    if (!layers.length) return;
    var depths = { 'ha-laptop': 0.55, 'ha-phone': 1.05, 'ha-buds': 1.5 };
    var tx = 0, ty = 0, cx = 0, cy = 0, raf = null;
    function tick() {
      cx += (tx - cx) * 0.09;
      cy += (ty - cy) * 0.09;
      layers.forEach(function (l) {
        var d = 1;
        Object.keys(depths).forEach(function (k) { if (l.classList.contains(k)) d = depths[k]; });
        l.style.transform = 'translate3d(' + (cx * d).toFixed(2) + 'px,' + (cy * d).toFixed(2) + 'px,0)';
      });
      if (Math.abs(tx - cx) > 0.15 || Math.abs(ty - cy) > 0.15) raf = requestAnimationFrame(tick);
      else raf = null;
    }
    function kick() { if (!raf) raf = requestAnimationFrame(tick); }
    box.addEventListener('mousemove', function (e) {
      var r = box.getBoundingClientRect();
      tx = ((e.clientX - r.left) / r.width - 0.5) * 16;
      ty = ((e.clientY - r.top) / r.height - 0.5) * 11;
      kick();
    });
    box.addEventListener('mouseleave', function () { tx = 0; ty = 0; kick(); });
  }

  /* ---------- Каталог ---------- */
  var catState;
  function renderCatalog() {
    catState = {
      cat: qp('cat'), q: qp('q'), sale: qp('sale') === '1',
      brands: [], min: '', max: '', sort: 'pop', page: 1
    };
    buildFilterUI();
    applyCatalog();

    document.querySelector('.sortsel').addEventListener('change', function () {
      catState.sort = this.value; catState.page = 1; applyCatalog();
    });
    var fl = document.querySelector('.filters');
    document.querySelector('.fbtn').addEventListener('click', function () { fl.classList.add('open'); document.body.style.overflow = 'hidden'; });
    document.querySelectorAll('.fclose, .fapply').forEach(function (b) {
      b.addEventListener('click', function () { fl.classList.remove('open'); document.body.style.overflow = ''; });
    });
  }

  function pool() {
    var list = D.products.slice();
    if (catState.cat) list = list.filter(function (p) { return p.cat === catState.cat; });
    if (catState.q) {
      var q = catState.q.toLowerCase();
      list = list.filter(function (p) { return (p.name + ' ' + p.brand).toLowerCase().indexOf(q) !== -1; });
    }
    return list;
  }

  function buildFilterUI() {
    var base = pool();
    var brands = {};
    base.forEach(function (p) { brands[p.brand] = (brands[p.brand] || 0) + 1; });
    var bhtml = Object.keys(brands).sort().map(function (b) {
      return '<label class="check"><input type="checkbox" value="' + esc(b) + '" data-f="brand">' +
        '<span class="box">' + IC.check + '</span>' + esc(b) + ' <span style="color:var(--ink-3);font-size:12.5px">' + brands[b] + '</span></label>';
    }).join('');
    document.getElementById('f-brands').innerHTML = bhtml || '<span style="font-size:13px;color:var(--ink-3)">Нет брендов</span>';

    document.getElementById('f-sale').checked = catState.sale;

    var chips = '<a class="chip ' + (!catState.cat ? 'on' : '') + '" href="catalog.html' + (catState.q ? '?q=' + encodeURIComponent(catState.q) : '') + '">Все</a>' +
      D.categories.map(function (c) {
        return '<a class="chip ' + (catState.cat === c.id ? 'on' : '') + '" href="catalog.html?cat=' + c.id + '">' + esc(c.name) + '</a>';
      }).join('');
    document.getElementById('cat-chips').innerHTML = chips;

    document.querySelector('.filters').addEventListener('change', function (e) {
      if (e.target.dataset.f === 'brand') {
        catState.brands = Array.from(document.querySelectorAll('[data-f="brand"]:checked')).map(function (i) { return i.value; });
      }
      if (e.target.id === 'f-sale') catState.sale = e.target.checked;
      catState.page = 1; applyCatalog();
    });
    ['f-min', 'f-max'].forEach(function (id) {
      document.getElementById(id).addEventListener('input', function () {
        catState[id === 'f-min' ? 'min' : 'max'] = this.value;
        catState.page = 1;
        clearTimeout(this._t); var self = this;
        this._t = setTimeout(function () { applyCatalog(); }, 350);
      });
    });
    document.querySelector('.freset').addEventListener('click', function () {
      go('catalog.html' + (catState.cat ? '?cat=' + catState.cat : ''));
    });
  }

  function applyCatalog() {
    var list = pool();
    if (catState.brands.length) list = list.filter(function (p) { return catState.brands.indexOf(p.brand) !== -1; });
    if (catState.sale) list = list.filter(function (p) { return p.old; });
    if (catState.min) list = list.filter(function (p) { return p.price >= +catState.min; });
    if (catState.max) list = list.filter(function (p) { return p.price <= +catState.max; });

    var sorts = {
      pop: function (a, b) { return (b.hit - a.hit) || (b.rating * b.votes - a.rating * a.votes); },
      cheap: function (a, b) { return a.price - b.price; },
      exp: function (a, b) { return b.price - a.price; },
      disc: function (a, b) { return discount(b) - discount(a); },
      new: function (a, b) { return (!!b.isnew - !!a.isnew) || (b.rating - a.rating); }
    };
    list.sort(sorts[catState.sort] || sorts.pop);

    var c = catById(catState.cat);
    var title = catState.q ? 'Поиск: «' + catState.q + '»' : (c ? c.name : 'Каталог');
    document.getElementById('cat-title').textContent = title;
    document.title = title + ' · Ракета, магазин электроники в Магнитогорске';
    document.getElementById('cat-count').textContent = list.length + ' ' + plural(list.length, 'товар', 'товара', 'товаров');
    var bc = document.getElementById('crumb-cur');
    if (bc) bc.textContent = title;

    /* Витрина флагмана: только чистая первая страница категории */
    var showcase = '';
    var noFilters = !catState.brands.length && !catState.sale && !catState.min && !catState.max && catState.sort === 'pop';
    var feat = c && noFilters && catState.page === 1 ?
      list.find(function (p) { return p.featured; }) : null;
    if (feat) {
      list = list.filter(function (p) { return p.id !== feat.id; });
      showcase =
        '<a class="showcase" href="product.html?id=' + feat.id + '">' +
        '<span class="sc-kick">Витрина категории</span><h3>' + esc(feat.name) + '</h3>' +
        '<p>' + esc(feat.desc) + '</p>' +
        '<div class="sc-price">' + fmt(feat.price) + (feat.old ? '<span class="price-old">' + fmt(feat.old) + '</span>' : '') + '</div>' +
        '<span class="btn btn-light">Подробнее' + IC.arrowR + '</span>' +
        '<span class="promo-art">' + artOf(feat) + '</span></a>';
    }

    var pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    catState.page = Math.min(catState.page, pages);
    var slice = list.slice((catState.page - 1) * PAGE_SIZE, catState.page * PAGE_SIZE);

    var grid = document.getElementById('cat-grid');
    if (!list.length) {
      grid.innerHTML = '<div class="noresults" style="grid-column:1/-1"><b>Ничего не нашлось</b>' +
        'Попробуйте изменить запрос или сбросить фильтры</div>';
    } else {
      grid.innerHTML = showcase + slice.map(cardHTML).join('');
    }

    var pager = document.getElementById('cat-pager');
    if (pages > 1) {
      var pb = '';
      for (var i = 1; i <= pages; i++) {
        pb += '<button class="pageb ' + (i === catState.page ? 'on' : '') + '" data-pg="' + i + '">' + i + '</button>';
      }
      pager.innerHTML = pb;
      pager.querySelectorAll('[data-pg]').forEach(function (b) {
        b.addEventListener('click', function () {
          catState.page = +b.dataset.pg; applyCatalog();
          document.querySelector('.cat-top').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    } else pager.innerHTML = '';
  }

  /* ---------- Корзина и оформление ---------- */
  var promoApplied = 0, promoCode = '';
  function renderCartPage() {
    var mount = document.getElementById('cart-root');
    var t = Cart.compute(promoApplied);

    if (!t.lines.length) {
      mount.innerHTML =
        '<div class="empty"><div class="e-ic">' + IC.cart + '</div><h1>Корзина пуста</h1>' +
        '<p>Загляните в каталог: хиты, новинки и честные скидки уже ждут.</p>' +
        '<a class="btn btn-primary btn-lg" href="catalog.html">Перейти в каталог</a></div>';
      return;

    var lines = t.lines.map(function (l) {
      return '<div class="cline">' +
        '<a class="cline-art" href="product.html?id=' + l.p.id + '">' + artOf(l.p) + '</a>' +
        '<div class="cline-info"><a href="product.html?id=' + l.p.id + '"><b>' + esc(l.p.name) + '</b></a>' +
        '<span>' + esc(l.p.brand) + '</span>' +

        '<button class="cl-remove" data-rm="' + l.p.id + '">' + IC.trash + 'Удалить</button></div>' +
        '<div class="cline-side"><div class="qty">' +
        '<button data-q="-1" data-id="' + l.p.id + '" aria-label="Меньше">' + IC.minus + '</button><b>' + l.qty + '</b>' +
        '<button data-q="1" data-id="' + l.p.id + '" aria-label="Больше">' + IC.plus + '</button></div>' +
        '<span class="cline-sum">' + fmt(l.sum) + '</span></div></div>';
    }).join('');

    var bundleRows = t.bundles.map(function (b) {
      return '<div class="bundleline">' + IC.check + 'Комплект «' + esc(b.name.slice(0, 28)) + '…»: скидка ' + fmt(b.bundle.save) + ' применена</div>';
    }).join('');

    /* Рекомендации: аксессуары к товарам в корзине, которых ещё нет */
    var inCart = t.lines.map(function (l) { return l.p.id; });
    var recIds = [];
    t.lines.forEach(function (l) {
      (l.p.acc || []).forEach(function (id) {
        if (inCart.indexOf(id) === -1 && recIds.indexOf(id) === -1) recIds.push(id);
      });
    });
    var recs = recIds.slice(0, 6).map(byId).filter(Boolean);
    var recHtml = recs.length ?
      '<section class="sec" style="padding-top:34px"><div class="sec-head"><div><h2>Не забудьте добавить</h2>' +
      '<div class="sub">Подобрано к товарам в вашей корзине</div></div></div>' +
      '<div class="minicards">' + recs.map(function (a) {
        return '<div class="minicard" data-href="product.html?id=' + a.id + '">' +
          '<span class="mc-art">' + artOf(a) + '</span>' +
          '<div><b>' + esc(a.name) + '</b><div class="mc-price">' + fmt(a.price) + '</div></div>' +
          '<button class="mc-add" data-add="' + a.id + '" aria-label="Добавить">' + IC.plus + '</button></div>';
      }).join('') + '</div></section>' : '';

    mount.innerHTML =
      '<div class="cat-head" style="margin-top:8px"><h1>Корзина</h1><span class="cnt">' +
      t.count + ' ' + plural(t.count, 'товар', 'товара', 'товаров') + '</span></div>' +
      '<div class="cart-layout"><div>' + lines + bundleRows + recHtml + '</div>' +
      '<aside class="csummary"><h3>Ваш заказ</h3>' +
      '<div class="crow"><span>Товары (' + t.count + ')</span><b>' + fmt(t.oldSubtotal) + '</b></div>' +
      (t.productSave ? '<div class="crow saving"><span>Скидки на товары</span><b>−' + fmt(t.productSave) + '</b></div>' : '') +
      (t.bundleSave ? '<div class="crow saving"><span>Скидка за комплекты</span><b>−' + fmt(t.bundleSave) + '</b></div>' : '') +
      (t.promoSave ? '<div class="crow saving"><span>Промокод ' + esc(promoCode) + '</span><b>−' + fmt(t.promoSave) + '</b></div>' : '') +
      '<div class="crow"><span>Доставка</span><b>' + (t.total >= D.delivery.freeFrom ? 'Бесплатно' : 'от ' + fmt(D.delivery.courier)) + '</b></div>' +
      '<div class="promo-row"><label class="sr-only" for="promo">Промокод</label>' +
      '<input id="promo" placeholder="Промокод" value="' + esc(promoCode) + '"><button class="btn btn-ghost" id="promo-go">ОК</button></div>' +
      '<div class="promo-msg" id="promo-msg"></div>' +

      '<a class="btn btn-primary btn-lg btn-block" href="#checkout">Перейти к оформлению</a>' +

      '</aside></div>' +

      '<section class="checkout" id="checkout"><h2>Оформление заказа</h2>' +
      '<form id="order-form" novalidate><div class="fields">' +
      '<div class="field"><label for="o-name">Имя</label><input id="o-name" autocomplete="name" placeholder="Как к вам обращаться">' +

      '<div class="field"><label for="o-phone">Телефон</label><input id="o-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 ___ ___-__-__">' +

      '<span class="rc-tag">Бесплатно</span></label>' +
      '<label class="rcard"><input type="radio" name="dlv" value="courier"><span class="dot"></span>' +
      '<div><b>Доставка по Магнитогорску</b><span>Сегодня или завтра, интервал согласует менеджер</span></div>' +
      '<span class="rc-tag">' + (Cart.compute(promoApplied).total >= D.delivery.freeFrom ? 'Бесплатно' : fmt(D.delivery.courier)) + '</span></label>' +
      '</div></div>' +
      '<div class="field field-full" id="addr-field" style="display:none"><label for="o-addr">Адрес доставки</label>' +
      '<input id="o-addr" autocomplete="street-address" placeholder="Улица, дом, квартира"></div>' +

      '<label class="rcard"><input type="radio" name="pay" value="online"><span class="dot"></span>' +
      '<div><b>Онлайн на сайте</b><span>Подключается на следующем этапе (эквайринг + чек 54-ФЗ)</span></div>' +
      '<span class="rc-tag badge badge-new" style="height:24px">Скоро</span></label>' +
      '<label class="rcard"><input type="radio" name="pay" value="installment"><span class="dot"></span>' +
      '<div><b>Рассрочка 0-0-12</b><span>Оформление за 10 минут, нужен только паспорт</span></div></label>' +
      '</div></div>' +
      '<div class="field field-full"><label for="o-comment">Комментарий</label>' +
      '<textarea id="o-comment" placeholder="Например: позвоните заранее"></textarea></div>' +
      '</div>' +
      '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:22px">' +
      '<button class="btn btn-primary btn-lg" type="submit">Оформить заказ</button>' +
      '<span style="font-size:13px;color:var(--ink-3)">Нажимая кнопку, вы соглашаетесь с условиями обработки данных</span></div>' +
      '</form></section>';

    /* события корзины */
    mount.querySelectorAll('[data-q]').forEach(function (b) {
      b.addEventListener('click', function () {
        var c = Cart.read();
        var line = c.items.find(function (i) { return i.id === b.dataset.id; });
        Cart.setQty(b.dataset.id, line.qty + (+b.dataset.q));
        renderCartPage();
      });
    });
    mount.querySelectorAll('[data-rm]').forEach(function (b) {
      b.addEventListener('click', function () { Cart.remove(b.dataset.rm); renderCartPage(); });
    });
    document.getElementById('promo-go').addEventListener('click', function (e) {
      e.preventDefault();
      var v = document.getElementById('promo').value.trim().toUpperCase();
      var msg = document.getElementById('promo-msg');
      if (D.promo[v]) {
        promoApplied = D.promo[v]; promoCode = v;
        renderCartPage();
        document.getElementById('promo-msg').textContent = 'Промокод применён: −' + Math.round(D.promo[v] * 100) + '%';
        document.getElementById('promo-msg').className = 'promo-msg ok';
      } else {
        promoApplied = 0; promoCode = '';
        msg.textContent = v ? 'Такого промокода нет. Подсказка: РАКЕТА10' : 'Введите промокод';
        msg.className = 'promo-msg err';
      }
    });
    mount.querySelectorAll('[name="dlv"]').forEach(function (r) {
      r.addEventListener('change', function () {
        document.getElementById('addr-field').style.display = r.value === 'courier' && r.checked ? '' : 'none';
      });
    });
    document.getElementById('order-form').addEventListener('submit', function (e) {

      var name = document.getElementById('o-name');
      var phone = document.getElementById('o-phone');

      name.closest('.field').classList.toggle('err', !name.value.trim());
      if (!name.value.trim()) ok = false;
      var digits = phone.value.replace(/\D/g, '');
      phone.closest('.field').classList.toggle('err', digits.length < 10);
      if (digits.length < 10) ok = false;
      if (!ok) return;

      var tt = Cart.compute(promoApplied);
      var order = {
        num: 'РК-' + new Date().toISOString().slice(2, 10).replace(/-/g, '') + '-' + Math.floor(100 + Math.random() * 900),
        name: name.value.trim(), phone: phone.value.trim(),
        delivery: mount.querySelector('[name="dlv"]:checked').value,
        address: (document.getElementById('o-addr') || {}).value || '',
        payment: mount.querySelector('[name="pay"]:checked').value,
        comment: document.getElementById('o-comment').value.trim(),
        promo: promoCode || null,
        items: tt.lines.map(function (l) { return { id: l.p.id, name: l.p.name, qty: l.qty, price: l.p.price }; }),
        total: tt.total
      };
      console.log('[РАКЕТА демо] Новый заказ:', order);
      Cart.clear();
      mount.innerHTML =
        '<div class="success"><div class="s-ic">' + IC.check + '</div>' +
        '<h1>Заказ оформлен</h1>' +
        '<p>Номер заказа: <span class="ordernum">' + order.num + '</span></p>' +
        '<p>Менеджер позвонит на ' + esc(order.phone) + ' в течение 10 минут, подтвердит наличие и ' +
        (order.delivery === 'pickup' ? 'отложит товар на кассе.' : 'согласует время доставки.') + '</p>' +
        '<a class="btn btn-primary btn-lg" href="catalog.html">Продолжить покупки</a></div>';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  /* ---------- Акции ---------- */
  function renderSales() {
    var sale = D.products.filter(function (p) { return p.old; })
      .sort(function (a, b) { return discount(b) - discount(a); });
    document.getElementById('sale-grid').innerHTML = sale.map(cardHTML).join('');
    document.getElementById('sale-count').textContent =
      sale.length + ' ' + plural(sale.length, 'товар со скидкой', 'товара со скидкой', 'товаров со скидкой');
  }

  /* ---------- Контакты ---------- */
  function renderContacts() {
    var f = document.getElementById('contact-form');
    if (!f) return;
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = f.querySelector('#cf-name').value.trim();
      var phone = f.querySelector('#cf-phone').value.trim();
      if (!name || phone.replace(/\D/g, '').length < 10) {
        toast('Заполните имя и телефон'); return;
      }
      console.log('[РАКЕТА демо] Обратная связь:', {
        name: name, phone: phone, message: f.querySelector('#cf-msg').value.trim()
      });
      f.innerHTML = '<div class="success" style="padding:26px 0"><div class="s-ic">' + IC.check + '</div>' +
        '<h1 style="font-size:22px">Сообщение отправлено</h1><p>Ответим в рабочее время: ' + esc(D.store.hours.toLowerCase()) + '.</p></div>';
    });
  }

  /* ---------- SPA-роутер (однофайловая версия) ---------- */
  var TPL = window.__RAKETA_TPL;
  var route = { page: 'home', query: {} };
  var FILE2PAGE = {
    'index.html': 'home', 'catalog.html': 'catalog', 'product.html': 'product',
    'cart.html': 'cart', 'sales.html': 'sales', 'delivery.html': 'delivery',
    'warranty.html': 'warranty', 'contacts.html': 'contacts'
  };

  function parseHash() {
    var h = location.hash || '#/';
    if (h.indexOf('#/') !== 0) return null;
    var s = h.slice(2), qi = s.indexOf('?');
    var page = (qi === -1 ? s : s.slice(0, qi)) || 'home';
    var query = {};
    if (qi !== -1) s.slice(qi + 1).split('&').forEach(function (kv) {
      var p = kv.split('=');
      query[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
    });
    return { page: TPL[page] ? page : 'home', query: query };
  }

  function go(href) {
    var file = href.split('?')[0].split('/').pop();
    var page = FILE2PAGE[file];
    if (page === undefined) { window.open(href, '_blank'); return; }
    var q = href.indexOf('?') !== -1 ? '?' + href.split('?').slice(1).join('?') : '';
    var target = '#/' + (page === 'home' ? '' : page) + q;
    if (location.hash === target) renderRoute(); else location.hash = target;
  }

  function renderRoute() {
    var r = parseHash();
    if (!r) return;
    route = r;
    document.body.dataset.page = r.page;
    document.body.classList.toggle('prod-bottom-pad', r.page === 'product');
    document.getElementById('view').innerHTML = TPL[r.page].html;
    document.title = TPL[r.page].title;
    document.querySelectorAll('.nav a').forEach(function (a) {
      a.classList.toggle('on', FILE2PAGE[a.getAttribute('href').split('?')[0]] === r.page);
    });
    var mm = document.querySelector('.mmenu');
    if (mm) { mm.classList.remove('open'); mm.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; }
    document.querySelectorAll('#view [data-art],#view [data-img]').forEach(function (el) {
      el.innerHTML = el.dataset.img
        ? '<img src="' + el.dataset.img + '" alt="">'
        : ART(el.dataset.art, el.dataset.tone);
    });
    if (r.page === 'home') renderHome();
    if (r.page === 'catalog') renderCatalog();
    if (r.page === 'product') renderProduct();
    if (r.page === 'cart') renderCartPage();
    if (r.page === 'sales') renderSales();
    if (r.page === 'contacts') renderContacts();
    reveal();
    window.scrollTo(0, 0);
  }

  /* Все ссылки на *.html уводим в hash-роутер, якоря скроллим плавно */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href');
    if (!href) return;
    if (href.charAt(0) === '#') {
      if (href.indexOf('#/') === 0) return;
      e.preventDefault();
      var el = document.getElementById(href.slice(1));
      if (el) el.scrollIntoView({ behavior: 'smooth' });
      return;
    }
    if (/^(https?:|tel:|mailto:)/i.test(href)) return;
    if (FILE2PAGE[href.split('?')[0].split('/').pop()] !== undefined) {
      e.preventDefault();
      go(href);
    }
  }, true);

  document.addEventListener('submit', function (e) {
    var f = e.target && e.target.closest ? e.target.closest('form.search') : null;
    if (!f) return;
    e.preventDefault();
    var inp = f.querySelector('input[type="search"]');
    go('catalog.html?q=' + encodeURIComponent(inp ? inp.value.trim() : ''));
  });

  window.addEventListener('hashchange', renderRoute);

  function boot() {
    document.body.classList.add('js');
    chrome();
    bindCardEvents(document);
    renderRoute();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
