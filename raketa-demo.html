      name.closest('.field').classList.toggle('err', !name.value.trim());
      if (!name.value.trim()) ok = false;
      var digits = phone.value.replace(/\D/g, '');
      phone.closest('.field').classList.toggle('err', digits.length < 10);
      if (digits.length < 10) ok = false;
      if (!ok) return;

      var tt = Cart.compute(promoApplied);
      var order = {
        num: 'РК-' + new Date().toISOString().slice(2, 10).replace(/-/g, '') + '-' + Math.floor(100 + Math.random() * 900),
        name: name.value.trim(), phone: phone.value.trim(),
        delivery: mount.querySelector('[name="dlv"]:checked').value,
        address: (document.getElementById('o-addr') || {}).value || '',
        payment: mount.querySelector('[name="pay"]:checked').value,
        comment: document.getElementById('o-comment').value.trim(),
        promo: promoCode || null,
        items: tt.lines.map(function (l) { return { id: l.p.id, name: l.p.name, qty: l.qty, price: l.p.price }; }),
        total: tt.total
      };
      console.log('[РАКЕТА демо] Новый заказ:', order);
      Cart.clear();
      mount.innerHTML =
        '<div class="success"><div class="s-ic">' + IC.check + '</div>' +
        '<h1>Заказ оформлен</h1>' +
        '<p>Номер заказа: <span class="ordernum">' + order.num + '</span></p>' +
        '<p>Менеджер позвонит на ' + esc(order.phone) + ' в течение 10 минут, подтвердит наличие и ' +
        (order.delivery === 'pickup' ? 'отложит товар на кассе.' : 'согласует время доставки.') + '</p>' +
        '<a class="btn btn-primary btn-lg" href="catalog.html">Продолжить покупки</a></div>';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  /* ---------- Акции ---------- */
  function renderSales() {
    var sale = D.products.filter(function (p) { return p.old; })
      .sort(function (a, b) { return discount(b) - discount(a); });
    document.getElementById('sale-grid').innerHTML = sale.map(cardHTML).join('');
    document.getElementById('sale-count').textContent =
      sale.length + ' ' + plural(sale.length, 'товар со скидкой', 'товара со скидкой', 'товаров со скидкой');
  }

  /* ---------- Контакты ---------- */
  function renderContacts() {
    var f = document.getElementById('contact-form');
    if (!f) return;
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = f.querySelector('#cf-name').value.trim();
      var phone = f.querySelector('#cf-phone').value.trim();
      if (!name || phone.replace(/\D/g, '').length < 10) {
        toast('Заполните имя и телефон'); return;
      }
      console.log('[РАКЕТА демо] Обратная связь:', {
        name: name, phone: phone, message: f.querySelector('#cf-msg').value.trim()
      });
      f.innerHTML = '<div class="success" style="padding:26px 0"><div class="s-ic">' + IC.check + '</div>' +
        '<h1 style="font-size:22px">Сообщение отправлено</h1><p>Ответим в рабочее время: ' + esc(D.store.hours.toLowerCase()) + '.</p></div>';
    });
  }

  /* ---------- SPA-роутер (однофайловая версия) ---------- */
  var TPL = window.__RAKETA_TPL;
  var route = { page: 'home', query: {} };
  var FILE2PAGE = {
    'index.html': 'home', 'catalog.html': 'catalog', 'product.html': 'product',
    'cart.html': 'cart', 'sales.html': 'sales', 'delivery.html': 'delivery',
    'warranty.html': 'warranty', 'contacts.html': 'contacts'
  };

  function parseHash() {
    var h = location.hash || '#/';
    if (h.indexOf('#/') !== 0) return null;
    var s = h.slice(2), qi = s.indexOf('?');
    var page = (qi === -1 ? s : s.slice(0, qi)) || 'home';
    var query = {};
    if (qi !== -1) s.slice(qi + 1).split('&').forEach(function (kv) {
      var p = kv.split('=');
      query[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
    });
    return { page: TPL[page] ? page : 'home', query: query };
  }

  function go(href) {
    var file = href.split('?')[0].split('/').pop();
    var page = FILE2PAGE[file];
    if (page === undefined) { window.open(href, '_blank'); return; }
    var q = href.indexOf('?') !== -1 ? '?' + href.split('?').slice(1).join('?') : '';
    var target = '#/' + (page === 'home' ? '' : page) + q;
    if (location.hash === target) renderRoute(); else location.hash = target;
  }

  function renderRoute() {
    var r = parseHash();
    if (!r) return;
    route = r;
    document.body.dataset.page = r.page;
    document.body.classList.toggle('prod-bottom-pad', r.page === 'product');
    document.getElementById('view').innerHTML = TPL[r.page].html;
    document.title = TPL[r.page].title;
    document.querySelectorAll('.nav a').forEach(function (a) {
      a.classList.toggle('on', FILE2PAGE[a.getAttribute('href').split('?')[0]] === r.page);
    });
    var mm = document.querySelector('.mmenu');
    if (mm) { mm.classList.remove('open'); mm.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; }
    document.querySelectorAll('#view [data-art],#view [data-img]').forEach(function (el) {
      el.innerHTML = el.dataset.img
        ? '<img src="' + el.dataset.img + '" alt="">'
        : ART(el.dataset.art, el.dataset.tone);
    });
    if (r.page === 'home') renderHome();
    if (r.page === 'catalog') renderCatalog();
    if (r.page === 'product') renderProduct();
    if (r.page === 'cart') renderCartPage();
    if (r.page === 'sales') renderSales();
    if (r.page === 'contacts') renderContacts();
    reveal();
    window.scrollTo(0, 0);
  }

  /* Все ссылки на *.html уводим в hash-роутер, якоря скроллим плавно */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href');
    if (!href) return;
    if (href.charAt(0) === '#') {
      if (href.indexOf('#/') === 0) return;
      e.preventDefault();
      var el = document.getElementById(href.slice(1));
      if (el) el.scrollIntoView({ behavior: 'smooth' });
      return;
    }
    if (/^(https?:|tel:|mailto:)/i.test(href)) return;
    if (FILE2PAGE[href.split('?')[0].split('/').pop()] !== undefined) {
      e.preventDefault();
      go(href);
    }
  }, true);

  document.addEventListener('submit', function (e) {
    var f = e.target && e.target.closest ? e.target.closest('form.search') : null;
    if (!f) return;
    e.preventDefault();
    var inp = f.querySelector('input[type="search"]');
    go('catalog.html?q=' + encodeURIComponent(inp ? inp.value.trim() : ''));
  });

  window.addEventListener('hashchange', renderRoute);

  function boot() {
    document.body.classList.add('js');
    chrome();
    bindCardEvents(document);
    renderRoute();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
