<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="robots" content="index, follow, max-image-preview:large">

<!-- ПРОВЕРЬ ПЕРЕД ПУБЛИКАЦИЕЙ: замените example.com на свой домен здесь,
     в robots.txt и в sitemap.xml. -->
<link rel="canonical" href="{{SITE}}{{PATH}}">

<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="EasyLead">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{OG_DESC}}">
<meta property="og:url" content="{{SITE}}{{PATH}}">
<meta property="og:image" content="https://example.com/assets/img/easylead-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
{{SCHEMA}}

<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/img/logo-icon.svg">
<link rel="icon" sizes="32x32" href="/favicon.ico">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

<!-- Шрифты локальные: ни одного стороннего запроса на первом экране. -->
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/onest-cyrillic.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/onest-latin.woff2" crossorigin>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/easylead.css">

<!-- Ставится синхронно, до первой отрисовки: без JS секции не прячутся
     и страница видна целиком с первого кадра. -->
<script>document.documentElement.classList.add('js');</script>

</head>
