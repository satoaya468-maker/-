name: Deploy to GitHub Pages

# Публикует сайт на GitHub Pages — предпросмотр по адресу
# https://satoaya468-maker.github.io/-/
# Запускается после пуша в ветку сайта (ждёт, пока медиа скачаны).
on:
  push:
    branches: ["claude/autoglass-website-sjitg5"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
