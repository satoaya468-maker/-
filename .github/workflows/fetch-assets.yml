name: Fetch media assets

# Скачивает фотографии (Pexels, бесплатная лицензия) и hero-видео,
# сжимает видео и коммитит всё обратно в ветку.
# Сайт работает и без этих файлов: у каждой картинки есть CDN-фолбэк,
# у видео — постер. Workflow просто делает сайт самодостаточным.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if assets already fetched
        id: guard
        run: |
          if [ -f assets/img/hero-poster.jpg ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download photos from Pexels
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -u
          mkdir -p assets/img assets/video
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

          # fetch_img <файл> <ширина> <id-кандидаты...> — первый доступный побеждает
          fetch_img() {
            local out="$1" width="$2"; shift 2
            for id in "$@"; do
              url="https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&cs=tinysrgb&w=${width}"
              if curl -fsSL -A "$UA" --retry 2 -o "$out" "$url" \
                 && [ "$(stat -c%s "$out")" -gt 20000 ]; then
                echo "OK  $out <- pexels #$id"
                return 0
              fi
              rm -f "$out"
            done
            echo "WARN: не удалось скачать $out (останется CDN-фолбэк)"
            return 0
          }

          fetch_img assets/img/hero-poster.jpg 1920 1765286 14699971 32019884
          fetch_img assets/img/og-cover.jpg    1200 1765286 14699971 32019884
          fetch_img assets/img/svc-lobovoe.jpg 1280 2265634 19773544
          fetch_img assets/img/svc-skoly.jpg   1280 19773544 30798595 2265634
          fetch_img assets/img/svc-bokovye.jpg 1280 5940151 14699971
          fetch_img assets/img/svc-fary.jpg    1280 11079820 999001 19292944
          fetch_img assets/img/band-master.jpg 1920 8478265 3855771 16350651

      - name: Download and compress hero video
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        run: |
          set -u
          if [ -f assets/video/hero.mp4 ]; then
            echo "Видео уже скачано — пропускаем."
            exit 0
          fi
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

          # Кандидаты (Pexels, свободная лицензия), по убыванию приоритета:
          # 9340840  — дождь стекает по лобовому стеклу
          # 3011178  — мойка лобового стекла
          # 11137519 — вид из салона в дождь
          # 8987297  — мастер в гараже, ч/б
          # 4489795  — механик за работой в гараже
          # 6872093  — полировка чёрного авто в детейлинге
          CANDIDATES="9340840 3011178 11137519 8987297 4489795 6872093"
          QUALITIES="hd_1920_1080_25fps hd_1920_1080_30fps hd_1920_1080_24fps \
                     uhd_2560_1440_25fps uhd_2732_1440_25fps uhd_2560_1440_30fps \
                     hd_1280_720_25fps hd_1280_720_30fps sd_960_540_25fps"

          try_download() {  # try_download <id> -> work/raw.mp4
            local id="$1"
            for q in $QUALITIES; do
              url="https://videos.pexels.com/video-files/${id}/${id}-${q}.mp4"
              if curl -fsSL -A "$UA" -o work/raw.mp4 "$url" \
                 && [ "$(stat -c%s work/raw.mp4)" -gt 300000 ]; then
                echo "OK  видео #$id ($q)"; return 0
              fi
              rm -f work/raw.mp4
            done
            # запасной путь — страница загрузки (редирект на файл)
            if curl -fsSL -A "$UA" -o work/raw.mp4 "https://www.pexels.com/video/${id}/download/" \
               && [ "$(stat -c%s work/raw.mp4)" -gt 300000 ] \
               && file work/raw.mp4 | grep -qi 'MP4\|ISO Media'; then
              echo "OK  видео #$id (download-редирект)"; return 0
            fi
            rm -f work/raw.mp4
            return 1
          }

          mkdir -p work
          for id in $CANDIDATES; do
            try_download "$id" || continue
            # отсеиваем вертикальные ролики
            dims=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
                   -of csv=s=x:p=0 work/raw.mp4 || echo "0x0")
            w=${dims%x*}; h=${dims#*x}
            if [ "${w:-0}" -le "${h:-1}" ]; then
              echo "SKIP #$id: вертикальный ($dims)"; rm -f work/raw.mp4; continue
            fi
            # сжимаем: до 14 c, 1600px по ширине, без звука, для автоплея
            if ffmpeg -y -i work/raw.mp4 -t 14 -an \
                 -vf "scale=1600:-2:flags=lanczos" \
                 -c:v libx264 -crf 28 -preset slow -movflags +faststart \
                 assets/video/hero.mp4; then
              echo "ГОТОВО: assets/video/hero.mp4 из #$id"
              break
            fi
            rm -f work/raw.mp4 assets/video/hero.mp4
          done
          rm -rf work
          [ -f assets/video/hero.mp4 ] || echo "Видео не удалось получить — hero останется с постером."

      - name: Commit assets to branch
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "Нечего коммитить."
          else
            git commit -m "Добавить фотографии и hero-видео (Pexels)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
