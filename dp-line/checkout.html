<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Оформление заказа — Dp line</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#191C23">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<header data-dp-header></header>

<main class="wrap" id="page"></main>

<footer data-dp-footer></footer>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const $page = document.getElementById('page');
  const pickup = await DP.api.getPickup();
  const shop = await DP.api.getShop();

  const items = DP.cart.items();
  const parts = await Promise.all(items.map((it) => DP.api.getPart(it.partId)));
  const rows = items
    .map((it, i) => ({ it, p: parts[i], offer: parts[i] && parts[i].offers[it.offerIdx] }))
    .filter((r) => r.p && r.offer);

  if (!rows.length) {
    $page.innerHTML = `
      <div class="empty" style="margin-top:30px">
        <b>В корзине пусто</b>
        <p>Добавьте детали в корзину, чтобы оформить заказ.</p>
        <p><a class="btn" href="index.html" style="margin-top:12px">Перейти к поиску</a></p>
      </div>`;
    return;
  }

  const totalSum = rows.reduce((s, r) => s + r.offer.price * r.it.qty, 0);
  const maxDays = Math.max(...rows.map((r) => r.offer.daysMax || r.offer.days));

  $page.innerHTML = `
    <div class="toolbar" style="padding-inline:0">
      <nav class="bcrumb" style="padding-top:0" aria-label="Хлебные крошки">
        <a href="cart.html">← Корзина</a><span class="sep">/</span><span>Оформление</span>
      </nav>
      <h1 style="margin-top:10px">Оформление заказа</h1>
      <div class="meta">оплата при получении · без предоплаты</div>
    </div>

    <div class="co-grid">
      <form id="form" novalidate>
        <div class="panel">
          <div class="panel-b">
            <span class="lbl" style="margin-bottom:12px">1. Контакты</span>
            <div class="field">
              <label for="f-name">Имя <em>*</em></label>
              <input id="f-name" name="name" type="text" autocomplete="name" placeholder="Как к вам обращаться">
              <span class="ferr">Укажите имя</span>
            </div>
            <div class="field">
              <label for="f-phone">Телефон <em>*</em></label>
              <input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+7 (___) ___-__-__">
              <span class="ferr">Укажите телефон — позвоним, когда заказ поступит</span>
            </div>
            <div class="field">
              <label for="f-comment">Комментарий</label>
              <textarea id="f-comment" name="comment" rows="2" placeholder="Например: нужна пара, уточнить по совместимости…"></textarea>
            </div>
          </div>

          <div class="panel-b">
            <span class="lbl" style="margin-bottom:12px">2. Получение — самовывоз</span>
            <div class="pickup">
              <div>
                <b>${pickup.title}</b>
                <div class="addr">${pickup.address}</div>
                <div class="note">${pickup.note}</div>
                <div class="hrs">
                  ${pickup.hours.map((h) => `<div><span>${h.d}</span><span>${h.h}</span></div>`).join('')}
                </div>
              </div>
            </div>
          </div>

          <div class="panel-b">
            <button class="btn btn--lg btn--w" type="submit" id="submit">
              Подтвердить заказ · ${DP.fmt.price(totalSum)}
            </button>
            <p style="margin-top:10px;font-size:12px;color:var(--ink-3);text-align:center">
              Нажимая кнопку, вы соглашаетесь на обработку персональных данных
            </p>
          </div>
        </div>
      </form>

      <div class="panel">
        <div class="panel-b">
          <span class="lbl" style="margin-bottom:10px">Ваш заказ</span>
          <div class="co-items">
            ${rows.map(({ it, p, offer }) => `
              <div class="ci">
                <span class="nm"><b>${p.brand} ${p.article}</b>${p.name}</span>
                <span class="pp">${DP.fmt.price(offer.price * it.qty)}<small>${it.qty} шт · ${offer.days === 0 ? 'в наличии' : DP.fmt.days(offer)}</small></span>
              </div>`).join('')}
          </div>
        </div>
        <div class="panel-b">
          <div class="trow"><span>Готовность заказа</span><span class="p">${maxDays === 0 ? 'сегодня' : DP.fmt.days({ days: maxDays })}</span></div>
          <div class="trow total"><span>Итого</span><span class="p">${DP.fmt.price(totalSum)}</span></div>
        </div>
      </div>
    </div>`;

  /* лёгкая маска телефона */
  const $phone = document.getElementById('f-phone');
  $phone.addEventListener('input', () => {
    let d = $phone.value.replace(/\D/g, '');
    if (d.startsWith('8')) d = '7' + d.slice(1);
    if (d && !d.startsWith('7')) d = '7' + d;
    d = d.slice(0, 11);
    let out = '';
    if (d.length) out = '+7';
    if (d.length > 1) out += ' (' + d.slice(1, 4);
    if (d.length >= 4) out += ') ' + d.slice(4, 7);
    if (d.length >= 7) out += '-' + d.slice(7, 9);
    if (d.length >= 9) out += '-' + d.slice(9, 11);
    $phone.value = out;
  });

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const $name = document.getElementById('f-name');
    const digits = $phone.value.replace(/\D/g, '');
    let ok = true;
    $name.classList.toggle('inv', !$name.value.trim());
    if (!$name.value.trim()) ok = false;
    $phone.classList.toggle('inv', digits.length !== 11);
    if (digits.length !== 11) ok = false;
    if (!ok) {
      (document.querySelector('.inv') || $name).focus();
      return;
    }

    const $btn = document.getElementById('submit');
    $btn.disabled = true;
    $btn.innerHTML = '<span class="spin"></span> Отправляем…';

    const res = await DP.api.submitOrder({
      name: $name.value.trim(),
      phone: $phone.value,
      comment: document.getElementById('f-comment').value.trim(),
      items: rows.map(({ it, p, offer }) => ({
        id: p.id, article: p.article, brand: p.brand,
        qty: it.qty, price: offer.price, sup: offer.sup,
      })),
    });

    DP.cart.clear();

    $page.innerHTML = `
      <div class="success">
        <div class="okic">${DP.icon('check', 30)}</div>
        <h1>Заказ принят</h1>
        <div class="onum">№ ${res.num}</div>
        <p>Позвоним на <b class="mono" style="font-size:13.5px">${$phone.value}</b>, как только все позиции поступят на пункт выдачи${maxDays === 0 ? ' — всё уже в наличии, можно забирать сегодня' : ` (ориентир — ${maxDays === 1 ? 'завтра' : 'до ' + maxDays + ' дн.'})`}.</p>
        <div class="panel">
          <div class="panel-b">
            <div class="pickup">
              <div>
                <b>${pickup.title}</b>
                <div class="addr">${pickup.address}</div>
                <div class="note">${pickup.note}</div>
                <div class="hrs">${pickup.hours.map((h) => `<div><span>${h.d}</span><span>${h.h}</span></div>`).join('')}</div>
              </div>
            </div>
          </div>
          <div class="panel-b" style="display:flex;align-items:center;gap:10px">
            <a href="${shop.phoneHref}" style="font-weight:700">${shop.phone}</a>
            <span style="margin-left:auto;color:var(--ink-3);font-size:12px">вопросы по заказу</span>
          </div>
        </div>
        <a class="btn btn--ghost" href="index.html">← Вернуться в каталог</a>
      </div>`;
    window.scrollTo({ top: 0 });
  });
});
</script>
</body>
</html>
