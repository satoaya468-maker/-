<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252019"/>
      <stop offset="1" stop-color="#1c1813"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="60%">
      <stop offset="0" stop-color="#f0a53f" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f0a53f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="peg" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2" fill="#f5edde" opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#peg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="606" width="1200" height="24" fill="#f0a53f"/>

  <!-- мастер-медальон -->
