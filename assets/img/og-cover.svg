    <text x="86" y="300" fill="#f5edde" font-size="118" font-weight="600" letter-spacing="1">МАСТЕР</text>
    <text x="86" y="410" fill="#f5edde" font-size="118" font-weight="600" letter-spacing="1">НА ЧАС</text>
