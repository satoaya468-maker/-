<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Мастер — усатый мастеровой в кепке">
  <defs>
    <clipPath id="disc"><circle cx="150" cy="150" r="131"/></clipPath>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b957"/>
      <stop offset="1" stop-color="#df8420"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8ecd3"/>
      <stop offset="1" stop-color="#eddcbb"/>
    </linearGradient>
  </defs>

  <!-- медальон -->
  <circle cx="150" cy="150" r="145" fill="url(#ring)"/>
  <circle cx="150" cy="150" r="138" fill="#2b2620"/>
  <circle cx="150" cy="150" r="131" fill="url(#cream)"/>

  <g clip-path="url(#disc)">
    <!-- плечи / комбинезон -->
    <path d="M52 300 V250 q0-40 45-52 l16-5 h74 l16 5 q45 12 45 52 V300 Z" fill="#47504f"/>
    <path d="M52 300 V250 q0-40 45-52 l16-5 h74 l16 5 q45 12 45 52 V300 Z" fill="none" stroke="#333b3a" stroke-width="2" opacity=".5"/>
    <!-- рубашка -->
    <path d="M116 195 L150 236 L184 195 q-34 14 -68 0 Z" fill="#f5edde"/>
    <!-- лямки комбинезона -->
    <path d="M120 300 V214 q0-8 8-10 l6 42 V300 Z" fill="#f0a53f"/>
    <path d="M180 300 V214 q0-8 -8-10 l-6 42 V300 Z" fill="#f0a53f"/>
    <!-- нагрудник + карман с линейкой -->
    <rect x="130" y="236" width="40" height="64" rx="6" fill="#535d5c"/>
    <rect x="139" y="252" width="22" height="30" rx="3" fill="#47504f"/>
    <rect x="151" y="246" width="6" height="24" rx="2" fill="#f0a53f"/>
    <circle cx="127" cy="230" r="4.5" fill="#e6a94a"/>
    <circle cx="173" cy="230" r="4.5" fill="#e6a94a"/>

    <!-- шея -->
    <path d="M134 196 h32 v18 q-16 10 -32 0 Z" fill="#e0a877"/>
    <!-- уши -->
    <circle cx="92" cy="150" r="12" fill="#eab98d"/>
    <circle cx="208" cy="150" r="12" fill="#eab98d"/>
    <!-- лицо -->
    <path d="M96 138 q0 62 54 62 q54 0 54 -62 q0 -50 -54 -50 q-54 0 -54 50 Z" fill="#eab98d"/>
    <!-- румянец -->
    <ellipse cx="116" cy="166" rx="10" ry="6" fill="#e79b6f" opacity=".55"/>
    <ellipse cx="184" cy="166" rx="10" ry="6" fill="#e79b6f" opacity=".55"/>
    <!-- бакенбарды -->
    <path d="M98 132 q-4 26 8 40 q-14 -6 -16 -30 Z" fill="#43301f"/>
    <path d="M202 132 q4 26 -8 40 q14 -6 16 -30 Z" fill="#43301f"/>

    <!-- брови -->
    <path d="M112 138 q14 -9 30 -3" fill="none" stroke="#43301f" stroke-width="7" stroke-linecap="round"/>
    <path d="M158 135 q16 -6 30 3" fill="none" stroke="#43301f" stroke-width="7" stroke-linecap="round"/>
    <!-- глаза -->
    <circle cx="128" cy="152" r="6.5" fill="#3a2a1c"/>
    <circle cx="172" cy="152" r="6.5" fill="#3a2a1c"/>
    <circle cx="130" cy="150" r="2" fill="#fff" opacity=".85"/>
    <circle cx="174" cy="150" r="2" fill="#fff" opacity=".85"/>
    <!-- нос -->
    <path d="M150 156 q7 12 0 20 q-8 2 -10 -4" fill="none" stroke="#d89465" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- УСЫ — фирменная деталь -->
    <path d="M150 182
             q-6 6 -16 6 q-20 0 -32 -12 q-8 -8 -14 -6 q10 -14 28 -12
             q14 2 22 12 q8 -10 22 -12 q18 -2 28 12 q-6 -2 -14 6
             q-12 12 -32 12 q-10 0 -16 -6 Z" fill="#43301f"/>
    <!-- улыбка под усами -->
    <path d="M136 190 q14 10 28 0" fill="none" stroke="#b5713f" stroke-width="3.5" stroke-linecap="round"/>

    <!-- кепка -->
    <path d="M86 128 q-2 -58 64 -58 q66 0 64 58 q-64 -20 -128 0 Z" fill="#2f2a24"/>
    <path d="M86 128 q-2 -58 64 -58 q66 0 64 58 q-30 -10 -64 -10 q-34 0 -64 10 Z" fill="#37312a"/>
    <!-- козырёк -->
    <path d="M84 128 q-22 4 -30 16 q-2 8 8 8 q30 -6 76 -6 q-30 -14 -54 -18 Z" fill="#241f1a"/>
    <!-- пуговка + янтарная вставка -->
    <circle cx="150" cy="74" r="6" fill="#f0a53f"/>
    <rect x="118" y="112" width="64" height="9" rx="4.5" fill="#f0a53f" opacity=".9"/>
  </g>
</svg>
